<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">살 합자 심벌</title>
  <desc id="desc">시옷, 아, 리을의 획을 한 글자처럼 결합한 단색 인장형 심벌</desc>

  <!--
    ㅅ  M10 24 L32 8 L54 24
    ㅏ  M32 8 V56 + M32 24 H54
    ㄹ  M10 24 H54 V38 H20 V52 H54

    The right arm of ㅏ is the right half of ㄹ's first horizontal stroke.
    The apex/vertical of ㅏ is also the meeting point of both ㅅ strokes.
  -->
  <g fill="none" stroke="#B9232F" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M10 24 32 8 54 24" />
    <path d="M32 8V56" />
    <path d="M10 24H54V38H20V52H54" />
  </g>
</svg>
